<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="mbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C"/>
      <stop offset="100%" stop-color="#05101E"/>
    </linearGradient>
    <linearGradient id="mbStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366"/>
      <stop offset="100%" stop-color="#E60039"/>
    </linearGradient>
  </defs>
  <!-- Rounded App Icon Background -->
  <rect width="100" height="100" rx="22" fill="url(#mbBg)"/>
  <rect width="98" height="98" x="1" y="1" rx="21" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  
  <!-- MB Monogram Star Icon -->
  <g transform="translate(18, 16) scale(0.64)">
    <!-- MB 10-pill star representation -->
    <rect x="42" y="5" width="16" height="32" rx="8" fill="url(#mbStar)" transform="rotate(0 50 50)"/>
    <rect x="42" y="5" width="16" height="32" rx="8" fill="url(#mbStar)" transform="rotate(36 50 50)"/>
    <rect x="42" y="5" width="16" height="32" rx="8" fill="url(#mbStar)" transform="rotate(72 50 50)"/>
    <rect x="42" y="5" width="16" height="32" rx="8" fill="url(#mbStar)" transform="rotate(108 50 50)"/>
    <rect x="42" y="5" width="16" height="32" rx="8" fill="url(#mbStar)" transform="rotate(144 50 50)"/>
    <rect x="42" y="5" width="16" height="32" rx="8" fill="url(#mbStar)" transform="rotate(180 50 50)"/>
    <rect x="42" y="5" width="16" height="32" rx="8" fill="url(#mbStar)" transform="rotate(216 50 50)"/>
    <rect x="42" y="5" width="16" height="32" rx="8" fill="url(#mbStar)" transform="rotate(252 50 50)"/>
    <rect x="42" y="5" width="16" height="32" rx="8" fill="url(#mbStar)" transform="rotate(288 50 50)"/>
    <rect x="42" y="5" width="16" height="32" rx="8" fill="url(#mbStar)" transform="rotate(324 50 50)"/>
  </g>
  <!-- Text MB at bottom -->
  <text x="50" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="19" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">MB</text>
</svg>
